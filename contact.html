<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact.css" />
</head>
<body>

<section class="contact-section" id="contact">
  <div class="container">
    <h2>Contact Us</h2>

    <div class="contact-grid">
      <!-- Contact Form -->
      <div class="contact-form">
        <h3>Get in Touch</h3>
        <form id="contactForm">
          <input type="text" id="name" placeholder="Your Name" required />
          <input type="email" id="email" placeholder="Your Email" required />
          <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
          <button type="submit">Send Message</button>
        </form>
        <p id="formMessage" class="success-message"></p>
      </div>

      <!-- Contact Info -->
      <div class="contact-info">
        <h3>Our Office</h3>
        <p><strong>Address:</strong><br> 123 College Road, Cityname, Country</p>
        <p><strong>Phone:</strong> +123-456-7890<br><strong>Email:</strong> info@college.edu</p>
        <p><strong>Office Hours:</strong><br> Mon - Fri: 9:00 AM – 5:00 PM</p>
        <div class="map-container">
          <iframe src="https://maps.google.com/maps?q=123%20College%20Road&t=&z=13&ie=UTF8&iwloc=&output=embed"
            width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy">
          </iframe>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="contact.js"></script>
</body>
</html>
